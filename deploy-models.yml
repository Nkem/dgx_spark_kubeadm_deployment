---
- name: Deploy LLMs via KServe on Kubernetes
  hosts: k8s
  become: true
  vars:
    local_user: "{{ ansible_env.SUDO_USER | default('b') }}"
    kubeconfig: "/home/{{ ansible_env.SUDO_USER | default('b') }}/.kube/config"
    chart_dir: "{{ playbook_dir }}/charts/llm-serving"
    extra_values_file: "/tmp/llm-serving-values.yaml"
    default_model_resources:
      requests:
        cpu: "4"
        memory: 1Gi
      limits:
        cpu: "10"
        memory: 120Gi
        nvidia.com/gpu: "1"

  environment:
    KUBECONFIG: "{{ kubeconfig }}"

  tasks:
    # ── Verify model PVCs exist ──────────────────────────────────
    - name: Check model PVCs are bound
      become: true
      become_user: "{{ local_user }}"
      shell: |
        kubectl -n llm-serving get pvc ollama-{{ models.coding.name }} ollama-{{ models.reasoning.name }} --no-headers 2>/dev/null | grep -c Bound
      register: pvc_check
      failed_when: false
      changed_when: false

    - name: Warn if model PVCs not populated
      debug:
        msg: >
          Model PVCs not found or not bound in llm-serving namespace.
          Run download-models.yml first for pre-populated models.
      when: pvc_check.stdout | default('0') | int < 2

    # ── Install cert-manager (KServe prerequisite) ────────────────
    - name: Add Jetstack Helm repo
      become: true
      become_user: "{{ local_user }}"
      command: helm repo add jetstack https://charts.jetstack.io
      register: jetstack_repo
      changed_when: "'has been added' in jetstack_repo.stdout"
      failed_when: false

    - name: Update Helm repos
      become: true
      become_user: "{{ local_user }}"
      command: helm repo update

    - name: Check if cert-manager is installed
      become: true
      become_user: "{{ local_user }}"
      command: helm status cert-manager -n cert-manager
      register: certmgr_status
      failed_when: false
      changed_when: false

    - name: Install cert-manager
      become: true
      become_user: "{{ local_user }}"
      shell: |
        helm upgrade --install cert-manager jetstack/cert-manager \
          --namespace cert-manager \
          --create-namespace \
          --set crds.enabled=true \
          --wait --timeout 5m
      when: certmgr_status.rc != 0

    # ── Install KServe ────────────────────────────────────────────
    - name: Check if KServe CRDs are installed
      become: true
      become_user: "{{ local_user }}"
      command: kubectl get crd inferenceservices.serving.kserve.io
      register: kserve_crd_check
      failed_when: false
      changed_when: false

    - name: Install KServe CRDs
      become: true
      become_user: "{{ local_user }}"
      command: >
        helm upgrade --install kserve-crd oci://ghcr.io/kserve/charts/kserve-crd
        --version v0.16.0
        --wait --timeout 5m
      when: kserve_crd_check.rc != 0

    - name: Check if KServe controller is installed
      become: true
      become_user: "{{ local_user }}"
      command: helm status kserve -n kserve
      register: kserve_status
      failed_when: false
      changed_when: false

    - name: Install KServe (RawDeployment mode)
      become: true
      become_user: "{{ local_user }}"
      shell: |
        helm upgrade --install kserve oci://ghcr.io/kserve/charts/kserve \
          --version v0.16.0 \
          --namespace kserve \
          --create-namespace \
          --set kserve.controller.deploymentMode=RawDeployment \
          --wait --timeout 5m
      when: kserve_status.rc != 0

    - name: Wait for KServe controller to be ready
      become: true
      become_user: "{{ local_user }}"
      shell: |
        kubectl -n kserve wait --for=condition=Ready pods --all --timeout=120s
      retries: 3
      delay: 10
      register: kserve_ready
      until: kserve_ready.rc == 0

    # ── Merge extra_models into the chart values ─────────────────
    - name: Load the llm-serving chart defaults
      ansible.builtin.include_vars:
        file: "{{ chart_dir }}/values.yaml"
        name: llm_chart_defaults

    - name: Reject extra models the chart cannot serve
      ansible.builtin.assert:
        that:
          - item.name != models.coding.name
          - item.name != models.reasoning.name
          - item.source == 'ollama'
          - item.namespace == 'llm-serving'
          - item.pvc == 'ollama-' ~ item.name
        fail_msg: >-
          extra_models entry {{ item.name }} is invalid: it must not collide
          with the coding or reasoning model, must use source "ollama", must
          live in the llm-serving namespace, and its pvc must be
          "ollama-<name>" so Helm adopts the pre-populated volume.
        quiet: true
      loop: "{{ extra_models.values() | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Warn when the served set exceeds the GPU time slices
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ 2 + (extra_models | length) }} llm-serving models are
          enabled, but install-k8s.yml grants 5 GPU time slices. Pods beyond
          the budget stay Pending.
      when: (2 + (extra_models | length)) > 5

    - name: Build the extra-model chart entries
      ansible.builtin.set_fact:
        extra_chart_models: >-
          {{ extra_chart_models | default({}) | combine({
               item.name: {
                 'enabled': true,
                 'image': item.image | default('ollama/ollama:latest'),
                 'ollamaPull': item.tag,
                 'displayName': item.displayName | default(item.name),
                 'port': item.port | default(11434),
                 'numCtx': item.numCtx | default('32768'),
                 'numParallel': item.numParallel | default('1'),
                 'resources': item.resources | default(default_model_resources),
                 'persistence': {
                   'storageClass': item.storageClass | default('longhorn-models'),
                   'size': item.size
                 }
               } | combine(item.chart_values | default({}), recursive=True)}) }}
      loop: "{{ extra_models.values() | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Merge the extra models into the chart defaults
      ansible.builtin.set_fact:
        serving_models: >-
          {{ llm_chart_defaults.models
             | combine(extra_chart_models | default({}), recursive=True) }}

    - name: Write the merged chart values
      ansible.builtin.copy:
        dest: "{{ extra_values_file }}"
        mode: "0644"
        content: "{{ {'models': serving_models} | to_nice_yaml(indent=2) }}"

    # ── Deploy LLM serving chart ──────────────────────────────────
    - name: Deploy llm-serving Helm chart
      become: true
      become_user: "{{ local_user }}"
      shell: |
        helm upgrade --install llm-serving {{ chart_dir }} \
          --namespace llm-serving \
          --create-namespace \
          --values {{ extra_values_file }} \
          --set models.{{ models.coding.name }}.ollamaPull={{ models.coding.tag }} \
          --set models.{{ models.reasoning.name }}.ollamaPull={{ models.reasoning.tag }} \
          --set models.{{ models.reasoning.name }}.toolsAlias={{ models.reasoning.tools_alias }} \
          --wait --timeout 15m
      register: chart_install

    - name: Wait for model pods to be ready
      become: true
      become_user: "{{ local_user }}"
      shell: |
        kubectl -n llm-serving get pods --field-selector=status.phase=Running -o name | \
        xargs -r kubectl -n llm-serving wait --for=condition=Ready --timeout=600s
      retries: 6
      delay: 30
      register: pods_ready
      until: pods_ready.rc == 0

    # ── Verify models are registered ─────────────────────────────
    - name: Verify Qwen model is registered
      become: true
      become_user: "{{ local_user }}"
      shell: |
        kubectl -n llm-serving exec deploy/{{ models.coding.name }}-predictor -- ollama list
      register: qwen_verify
      retries: 12
      delay: 15
      until: qwen_verify.rc == 0 and models.coding.name in qwen_verify.stdout

    - name: Verify DeepSeek model is registered
      become: true
      become_user: "{{ local_user }}"
      shell: |
        kubectl -n llm-serving exec deploy/{{ models.reasoning.name }}-predictor -- ollama list
      register: deepseek_verify
      retries: 12
      delay: 15
      until: deepseek_verify.rc == 0 and models.reasoning.tools_alias in deepseek_verify.stdout

    - name: Verify extra models are registered
      become: true
      become_user: "{{ local_user }}"
      shell: |
        kubectl -n {{ item.namespace }} exec deploy/{{ item.name }}-predictor -- ollama list
      loop: "{{ extra_models.values() | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: extra_verify
      retries: 12
      delay: 15
      until: extra_verify.rc == 0 and item.tag in extra_verify.stdout

    - name: Show deployment status
      become: true
      become_user: "{{ local_user }}"
      shell: |
        echo "=== LLM Serving Pods ==="
        kubectl get pods -n llm-serving -o wide
        echo ""
        echo "=== InferenceServices ==="
        kubectl get inferenceservice -n llm-serving
        echo ""
        echo "=== Loaded Models ==="
        echo "Qwen:"
        kubectl -n llm-serving exec deploy/{{ models.coding.name }}-predictor -- ollama list 2>/dev/null || echo "  (not ready)"
        echo "DeepSeek:"
        kubectl -n llm-serving exec deploy/{{ models.reasoning.name }}-predictor -- ollama list 2>/dev/null || echo "  (not ready)"
        {% for m in extra_models.values() | list %}
        echo "{{ m.name }}:"
        kubectl -n {{ m.namespace }} exec deploy/{{ m.name }}-predictor -- ollama list 2>/dev/null || echo "  (not ready)"
        {% endfor %}
        echo ""
        echo "=== Cluster Endpoints ==="
        echo "Qwen:    {{ models.coding.backend_url }}"
        echo "DeepSeek: {{ models.reasoning.backend_url }}"
        {% for m in extra_models.values() | list %}
        echo "{{ m.name }}: http://{{ m.name }}-predictor.{{ m.namespace }}.svc.cluster.local:80"
        {% endfor %}
      register: status

    - name: Display status
      debug:
        var: status.stdout_lines
