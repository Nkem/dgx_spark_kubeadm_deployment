---
# Remove worker nodes from the cluster.
#
#   ansible-playbook -i inventory-multinode.ini leave-k8s.yml --become \
#     -e leave_confirm=true
#
# This is the supported way out. Draining first keeps the workloads off a node
# that is about to disappear; without the reset the old kubelet config and CNI
# state make a later rejoin fail in confusing ways.
#
# The control plane is never touched: `leave-k8s.yml` only acts on hosts in the
# `workers` group.
- name: Drain and delete the nodes
  hosts: k8s
  become: true
  gather_facts: true
  vars:
    local_user: "{{ ansible_env.SUDO_USER | default('b') }}"
    kubeconfig: "/home/{{ ansible_env.SUDO_USER | default('b') }}/.kube/config"
    leave_confirm: false
    leave_drain: true
    leave_timeout: 300s
  tasks:
    - name: Require explicit confirmation
      assert:
        that:
          - leave_confirm | bool
        fail_msg: >-
          Pass -e leave_confirm=true. This deletes Node objects and resets the
          workers; there is no undo short of join-k8s.yml.
        quiet: true

    - name: Require at least one worker
      assert:
        that:
          - groups['workers'] | default([]) | length > 0
        fail_msg: "No hosts in a `workers` group; nothing to remove."
        quiet: true

    - name: Drain the workers
      command:
        argv: [kubectl, drain, "{{ hostvars[item].node_name | default(item) }}",
               --ignore-daemonsets, --delete-emptydir-data,
               "--timeout={{ leave_timeout }}"]
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      become: true
      become_user: "{{ local_user }}"
      loop: "{{ groups['workers'] | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: leave_drain_run
      changed_when: "'drained' in leave_drain_run.stdout"
      # A node that is already gone fails the drain; the delete below is the
      # source of truth.
      failed_when: false
      when: leave_drain | bool

    - name: Delete the Node objects
      command:
        argv: [kubectl, delete, "node/{{ hostvars[item].node_name | default(item) }}",
               --ignore-not-found]
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      become: true
      become_user: "{{ local_user }}"
      loop: "{{ groups['workers'] | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: leave_delete
      changed_when: "'deleted' in leave_delete.stdout"

- name: Reset the workers
  hosts: workers
  become: true
  gather_facts: true
  vars:
    cri_socket: "unix:///run/containerd/containerd.sock"
  tasks:
    - name: Require explicit confirmation
      assert:
        that:
          - leave_confirm | bool
        fail_msg: >-
          Pass -e leave_confirm=true. This resets kubeadm on the workers and
          removes their local cluster state.
        quiet: true

    - name: Check whether the host was ever joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: leave_kubelet_conf

    - name: Reset kubeadm
      command: kubeadm reset -f --cri-socket {{ cri_socket }}
      register: leave_reset
      changed_when: leave_kubelet_conf.stat.exists

    - name: Remove the CNI configuration
      file:
        path: /etc/cni/net.d
        state: absent

    - name: Remove the kubelet credentials and cluster state
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /var/lib/etcd
        - /root/.kube

    - name: Remove the administrator kubeconfig, if any
      file:
        path: "/home/{{ ansible_env.SUDO_USER | default('b') }}/.kube/config"
        state: absent

    - name: Report
      debug:
        msg:
          - "{{ inventory_hostname }} was reset and removed from the cluster."
          - "Containerd and the NVIDIA runtime are left installed; rejoin with join-k8s.yml."
