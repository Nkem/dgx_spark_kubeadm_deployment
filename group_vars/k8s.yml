---
# ── Model Definitions ────────────────────────────────────────────────
# Single source of truth for all model names across playbooks and Helm charts.
# Keyed by ROLE — to swap a model, change its entry here.
#
# Fields:
#   name     — short identifier used in k8s resource names
#   tag      — full pull tag (ollama tag or HuggingFace repo)
#   source   — "ollama" or "huggingface" (controls download method)
#   namespace, pvc, size — download/storage config
#
# Role-specific optional fields:
#   backend_url, nodeport  — LLM serving endpoints (coding, reasoning)
#   tools_alias            — Ollama model alias for tool-use (reasoning)
#   num_ctx                — context window override (extract)

models:
  coding:
    name: "qwen3-coder-next"
    tag: "qwen3-coder-next:q4_K_M"
    source: ollama
    namespace: llm-serving
    pvc: "ollama-qwen3-coder-next"
    size: 60Gi
    backend_url: "http://qwen3-coder-next-predictor.llm-serving.svc.cluster.local:80"
    nodeport: 31434

  reasoning:
    name: "deepseek-r1-distill-32b"
    tag: "deepseek-r1:32b"
    source: ollama
    namespace: llm-serving
    pvc: "ollama-deepseek-r1-distill-32b"
    size: 30Gi
    backend_url: "http://deepseek-r1-distill-32b-predictor.llm-serving.svc.cluster.local:80"
    nodeport: 31435
    tools_alias: "deepseek-r1-distill-32b-tools"

  extract:
    name: "qwen3-8b"
    tag: "qwen3:8b"
    source: ollama
    namespace: graphrag
    pvc: ollama-extract-data
    size: 10Gi
    num_ctx: "8192"

  embed:
    name: "qwen3-embedding"
    tag: "qwen3-embedding:0.6b"
    source: ollama
    namespace: graphrag
    pvc: ollama-embed-data
    size: 5Gi

  reranker:
    name: "bge-reranker-v2-m3"
    tag: "BAAI/bge-reranker-v2-m3"
    source: huggingface
    namespace: graphrag
    pvc: vllm-rerank-data
    size: 5Gi

# ── Extra llm-serving Models ─────────────────────────────────────────
# Additional Ollama models served by charts/llm-serving beside the coding and
# reasoning entries above. Keyed by model name; every entry needs the download
# fields (name, tag, source, namespace, pvc, size) and may add the optional
# chart fields shown below.
#
#   name        — short identifier (DNS-1123); resource names are derived from it
#   tag         — Ollama pull tag
#   source      — must be "ollama": the llm-serving chart only serves Ollama
#   namespace   — llm-serving
#   pvc         — must be "ollama-<name>" so Helm adopts the pre-populated volume
#   size        — PVC size
#   storageClass, image, port, numCtx, numParallel, resources
#               — optional chart overrides; defaults match values.yaml
#   chart_values — optional free-form mapping merged over the fields above,
#                  for chart options this playbook does not name explicitly
#
# Example:
#   extra_models:
#     qwen3-14b:
#       name: qwen3-14b
#       tag: "qwen3:14b"
#       source: ollama
#       namespace: llm-serving
#       pvc: ollama-qwen3-14b
#       size: 20Gi
#       numCtx: "32768"
extra_models: {}
