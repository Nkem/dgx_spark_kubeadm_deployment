# Inventory for a control plane plus workers.
#
# `k8s` is the control plane: install-k8s.yml runs there and the day-2
# playbooks run kubectl from it. `workers` is every node join-k8s.yml adds.
#
# Name workers by their hostname, or set `node_name` to the name kubeadm
# registers — leave-k8s.yml and the readiness wait use it.
#
# The workers need the same prerequisites install-k8s.yml sets up (packages,
# kernel modules, sysctls, containerd with the NVIDIA runtime, swap off).

[k8s]
dgx-control ansible_host=10.0.0.10

[workers]
dgx-worker-1 ansible_host=10.0.0.11

[k8s:vars]
ansible_python_interpreter=/usr/bin/python3

[workers:vars]
ansible_python_interpreter=/usr/bin/python3
